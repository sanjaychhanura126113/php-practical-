<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Marwadi University</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="liquid-shimmer"></div>
    <div class="liquid-blob"></div>
    <div class="liquid-blob2"></div>
    <h2>Login</h2>

    <form id="loginForm">
        <input type="email" id="loginUsername" placeholder="Email" required>

        <input type="password" id="loginPassword" placeholder="Password" required>

        <div class="form-links">
            <label>
                <input type="checkbox" id="rememberMe"> Remember me
            </label>
            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">Login</button>
    </form>

    <p id="loginMsg"></p>

    <a href="register.html" class="signup-link">Don't have an account? Register</a>
</div>

<script src="script.js"></script>

</body>
</html>
